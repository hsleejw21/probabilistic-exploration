[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-exploration-bo"
version = "0.1.0"
description = "Probabilistic Exploration for Efficient Bayesian Optimization"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib==3.10.8",
  "numpy>=1.26.4,<3",
  "pandas==3.0.0",
  "scikit-learn==1.9.0",
  "scipy==1.17.1",
]

[project.optional-dependencies]
lunar = ["gymnasium[box2d]==1.3.0", "box2d==2.3.10", "pygame-ce==2.5.8", "swig==4.5.0"]
yahpo = ["numpy==1.26.4", "yahpo-gym==1.0.2", "ConfigSpace==0.6.1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
